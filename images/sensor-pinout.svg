<svg viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TOF sensor pinout: red VIN, black GND, white SIG" width="440" height="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect width="440" height="200" rx="12" fill="#ffffff"/><rect x="262" y="28.0" width="150" height="120" rx="20" fill="#1E1E1D"/><rect x="267" y="33.0" width="140" height="110" rx="16" fill="#3A3936"/><rect x="328" y="66" width="36" height="44" rx="9" fill="#151514"/><rect x="339.0" y="73" width="18" height="30" rx="9.0" fill="#353432" stroke="#0B0B0B" stroke-width="1.6"/><rect x="370" y="66" width="24" height="44" rx="9" fill="#151514"/><rect x="378.0" y="73" width="12" height="30" rx="6.0" fill="#353432" stroke="#0B0B0B" stroke-width="1.6"/><text x="274" y="73" font-size="8" font-weight="700" fill="#9A9893" font-family="Consolas,monospace">VIN</text><text x="274" y="91" font-size="8" font-weight="700" fill="#9A9893" font-family="Consolas,monospace">GND</text><text x="274" y="109" font-size="8" font-weight="700" fill="#9A9893" font-family="Consolas,monospace">SIG</text><text x="337.0" y="166.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2B2A29">TOF sensor</text><path d="M265 70 H168" fill="none" stroke="#D63B2F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="74" text-anchor="end" font-size="13" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">VIN</text><path d="M265 88 H168" fill="none" stroke="#2B2A29" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="92" text-anchor="end" font-size="13" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">GND</text><path d="M265 106 H168" fill="none" stroke="#8A9391" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M265 106 H168" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="110" text-anchor="end" font-size="13" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">SIG</text><g font-size="12" fill="#5F6B69"><text x="20" y="150" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">VIN</text><text x="58" y="150">red</text><text x="110" y="150">power, 2.8–5.5 V, up to 30 mA</text><text x="20" y="168" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">GND</text><text x="58" y="168">black</text><text x="110" y="168">ground</text><text x="20" y="186" font-weight="700" fill="#2B2A29" font-family="Consolas,monospace">SIG</text><text x="58" y="186">white</text><text x="110" y="186">open-drain I/O – needs a 2k–10k pull-up</text></g></svg>