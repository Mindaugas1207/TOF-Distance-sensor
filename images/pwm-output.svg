<svg viewBox="0 0 490 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PWM output: 20 ms period, 1 to 2 ms pulse" width="490" height="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif"><rect width="490" height="150" rx="12" fill="#ffffff"/><path d="M20 106 H50 V46 H79 V106 H430 V46 H460" fill="none" stroke="#0AA096" stroke-width="3" stroke-linejoin="round"/><rect x="50" y="46" width="38" height="60" fill="#0EBEB2" opacity=".12"/><line x1="69" y1="40" x2="69" y2="106" stroke="#6E7A78" stroke-dasharray="3 3"/><line x1="88" y1="40" x2="88" y2="106" stroke="#6E7A78" stroke-dasharray="3 3"/><text x="50" y="34" font-size="12" fill="#2B2A29">pulse 1–2 ms</text><text x="96" y="68" font-size="11.5" fill="#5F6B69">1 ms = min distance</text><text x="96" y="84" font-size="11.5" fill="#5F6B69">2 ms = max distance or invalid</text><line x1="50" y1="124" x2="430" y2="124" stroke="#6E7A78" stroke-width="1"/><line x1="50" y1="118" x2="50" y2="130" stroke="#6E7A78"/><line x1="430" y1="118" x2="430" y2="130" stroke="#6E7A78"/><text x="240.0" y="140" text-anchor="middle" font-size="12" fill="#2B2A29">period 20 ms (50 Hz, same as a hobby servo)</text></svg>